name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_ios_e2e:
        description: "Run the full iOS e2e suite"
        type: boolean
        default: true

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generates .nuxt/ (incl. the tsconfig vue-tsc and vitest rely on).
      # There is no postinstall hook, so this must run explicitly.
      - name: Prepare Nuxt
        run: npx nuxt prepare

      - name: Lint
        run: npm run lint

      # Run vue-tsc directly rather than `nuxt typecheck`: it is deterministic
      # in CI. The "vue-router/volar/sfc-route-blocks" resolve line it prints is
      # a non-fatal warning and does not affect the exit code.
      - name: Type-check
        run: npx vue-tsc --noEmit -p tsconfig.json

      - name: Test
        run: npx vitest run --coverage --coverage.include='app/**' --coverage.reporter=text --coverage.reporter=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # macOS minutes bill at 10x Linux, so the iOS job only runs when iOS code
  # actually changed. The TestFlight workflow applies the same path guard.
  ios-changes:
    name: Check for iOS changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Diff for ios/ changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Manual dispatch is an explicit request — always run the iOS job.
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            # API-computed file list: a local origin/main...HEAD diff on the
            # runner intermittently came back empty and silently skipped the job.
            FILES=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          else
            # First-parent diff = everything the merge/push brought in.
            FILES=$(git diff --name-only HEAD^ HEAD)
          fi
          if grep -qE '^(ios/|\.github/workflows/(ci|ios-testflight)\.yml)' <<<"$FILES"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "No iOS changes; skipping iOS job."
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  # Builds the app + test bundles once and runs the fast unit suite. The compiled
  # products are published so the e2e shards never rebuild (a macOS build is ~6 min
  # of billed-at-10x time; doing it once instead of per-shard is the whole point).
  ios-build:
    name: iOS build & unit tests (simulator)
    needs: ios-changes
    if: needs.ios-changes.outputs.ios == 'true'
    # macos-26 is required: Apple rejects App Store uploads not built with the
    # iOS 26 SDK since 2026-04-28, and CI stays on the same Xcode as releases.
    runs-on: macos-26
    timeout-minutes: 40
    env:
      XCODE_VERSION: "26.5"
      SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # Guard against silently-skipped tests: every test-bearing UITest class must be
      # assigned to exactly one e2e shard. A class added without a shard entry would
      # never run yet CI would stay green — fail loudly instead. (macOS runs bash, so
      # process substitution below is available.)
      - name: Verify e2e shard coverage
        run: |
          set -euo pipefail
          declared=$(for f in BettyUITests/*.swift; do
            awk '/^[[:space:]]*(final )?class [A-Za-z0-9_]+[[:space:]]*:/{c=$0;sub(/.*class /,"",c);sub(/[[:space:]:].*/,"",c);cls=c;n[cls]=n[cls]+0} /^[[:space:]]*func test/{if(cls)n[cls]++} END{for(k in n)if(n[k]>0)print k}' "$f"
          done | sort -u)
          assigned=$(grep -E '^[[:space:]]*classes:' ../.github/workflows/ci.yml | sed -E 's/^[[:space:]]*classes:[[:space:]]*//' | tr ' ' '\n' | sort -u)
          missing=$(comm -23 <(echo "$declared") <(echo "$assigned"))
          unknown=$(comm -13 <(echo "$declared") <(echo "$assigned"))
          if [ -n "$missing" ]; then echo "::error::UITest classes not assigned to any e2e shard:"; echo "$missing"; exit 1; fi
          if [ -n "$unknown" ]; then echo "::error::e2e shard references unknown UITest classes:"; echo "$unknown"; exit 1; fi
          echo "All $(echo "$declared" | grep -c .) UITest classes are covered by the e2e shards."

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild -project Betty.xcodeproj -scheme Betty \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath .derived \
            build-for-testing

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild -project Betty.xcodeproj -scheme Betty \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath .derived \
            test-without-building -only-testing:BettyTests

      # The .xctestrun references the .app bundles via __TESTROOT__ (paths relative
      # to the xctestrun's own dir), so the whole Build/Products tree must travel
      # together for `test-without-building -xctestrun` to resolve on the shards.
      - name: Upload compiled test bundle
        uses: actions/upload-artifact@v4
        with:
          name: betty-test-bundle
          path: ios/.derived/Build/Products
          retention-days: 1
          if-no-files-found: error

  # The hermetic e2e suite (in-process mock backend on ephemeral loopback ports, no
  # network) sharded across parallel runners. Each shard downloads the prebuilt
  # bundle and runs a test-count-balanced subset with 2 in-runner simulator clones
  # (a 3-vCPU standard runner sustains ~2 cleanly). Wall-clock per shard is ~7 min,
  # so the whole e2e stage finishes in ~10 min instead of the old ~60 min serial run.
  #
  # Rebalance the matrix when a class grows materially — the slowest shard is the
  # floor. Gated to iOS changes; a workflow_dispatch with run_ios_e2e=false skips
  # e2e for a build-and-unit-only check.
  ios-e2e:
    name: iOS e2e ${{ matrix.name }}
    needs: [ios-changes, ios-build]
    if: needs.ios-changes.outputs.ios == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_ios_e2e)
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shard1
            classes: HomeE2ETests GroupSettingsE2ETests GroupDetailLeaderboardE2ETests
          - name: shard2
            classes: LiveE2ETests TournamentsDetailE2ETests GroupJoinInviteE2ETests SmokeTests
          - name: shard3
            classes: GroupDetailE2ETests TournamentsAdminE2ETests ProfileLeaderboardE2ETests AuthDeepLinkE2ETests GroupDetailMoreE2ETests
          - name: shard4
            classes: ChatReactionsE2ETests ChatActivityE2ETests CompleteProfileE2ETests GroupCreateE2ETests GroupDetailNonAuthorCoverE2ETests
          - name: shard5
            classes: TournamentsE2ETests ProfileE2ETests ChatMoreE2ETests AuthSessionE2ETests
          - name: shard6
            classes: GroupBrowseE2ETests ProfileAccountE2ETests HomeNavigationE2ETests LiveConnectionE2ETests AuthBootFailureE2ETests
          - name: shard7
            classes: AuthSignInValidationE2ETests ChatE2ETests AuthLandingE2ETests GroupDetailGamesE2ETests ProfileAdminE2ETests
    env:
      XCODE_VERSION: "26.5"
      SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      # No checkout/build: `test-without-building -xctestrun` runs purely from the
      # downloaded products, restored to the same path the .xctestrun was built at.
      - name: Download compiled test bundle
        uses: actions/download-artifact@v4
        with:
          name: betty-test-bundle
          path: ios/.derived/Build/Products

      # Time allowances turn a hung test into one failure instead of a wedged shard.
      - name: UI tests (mock e2e) — ${{ matrix.name }}
        env:
          CLASSES: ${{ matrix.classes }}
        run: |
          set -o pipefail
          XCTESTRUN=$(ls .derived/Build/Products/*.xctestrun | head -1)
          ARGS=""
          for c in $CLASSES; do ARGS="$ARGS -only-testing:BettyUITests/$c"; done
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "$SIMULATOR_DESTINATION" \
            -parallel-testing-enabled YES -parallel-testing-worker-count 2 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 240 \
            $ARGS
