name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_ios_e2e:
        description: "Run the full iOS e2e suite"
        type: boolean
        default: true

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generates .nuxt/ (incl. the tsconfig vue-tsc and vitest rely on).
      # There is no postinstall hook, so this must run explicitly.
      - name: Prepare Nuxt
        run: npx nuxt prepare

      - name: Lint
        run: npm run lint

      # Run vue-tsc directly rather than `nuxt typecheck`: it is deterministic
      # in CI. The "vue-router/volar/sfc-route-blocks" resolve line it prints is
      # a non-fatal warning and does not affect the exit code.
      - name: Type-check
        run: npx vue-tsc --noEmit -p tsconfig.json

      - name: Test
        run: npx vitest run --coverage --coverage.include='app/**' --coverage.reporter=text --coverage.reporter=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-exist: ignore

  # macOS minutes bill at 10x Linux, so the iOS job only runs when iOS code
  # actually changed. The TestFlight workflow applies the same path guard.
  ios-changes:
    name: Check for iOS changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Diff for ios/ changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Manual dispatch is an explicit request — always run the iOS job.
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            # API-computed file list: a local origin/main...HEAD diff on the
            # runner intermittently came back empty and silently skipped the job.
            FILES=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          else
            # First-parent diff = everything the merge/push brought in.
            FILES=$(git diff --name-only HEAD^ HEAD)
          fi
          if grep -qE '^(ios/|\.github/workflows/(ci|ios-testflight)\.yml)' <<<"$FILES"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "No iOS changes; skipping iOS job."
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    name: iOS build, unit & e2e tests (simulator)
    needs: ios-changes
    if: needs.ios-changes.outputs.ios == 'true'
    # macos-26 is required: Apple rejects App Store uploads not built with the
    # iOS 26 SDK since 2026-04-28, and CI stays on the same Xcode as releases.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE_VERSION: "26.5"
      SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild -project Betty.xcodeproj -scheme Betty \
            -destination "$SIMULATOR_DESTINATION" \
            build-for-testing

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild -project Betty.xcodeproj -scheme Betty \
            -destination "$SIMULATOR_DESTINATION" \
            test-without-building -only-testing:BettyTests

      # Full e2e against the in-process mock backend (hermetic, no network).
      # Dispatch-only: the ~60-min suite is too slow for CI until it is
      # parallelized — run it locally or via workflow_dispatch before releases.
      # Time allowances turn a hung test into one failure instead of a wedged job.
      - name: UI tests (mock e2e)
        if: github.event_name == 'workflow_dispatch' && inputs.run_ios_e2e
        run: |
          set -o pipefail
          xcodebuild -project Betty.xcodeproj -scheme Betty \
            -destination "$SIMULATOR_DESTINATION" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 240 \
            test-without-building -only-testing:BettyUITests
