name: Play Store (Android)

# Gated on CI: uploads only run after the CI workflow succeeds on main
# (workflow_run loses push paths-filtering, so the cheap guard job below
# re-checks that Android code actually changed). Mirrors ios-testflight.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never upload two builds in parallel — Play versionCodes must ascend.
concurrency:
  group: android-playstore
  cancel-in-progress: false

env:
  # Must match the in-flight version in Play Console. Bump per release.
  ANDROID_VERSION_NAME: "1.0.0"

jobs:
  changes:
    name: Check for Android changes
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      upload: ${{ steps.diff.outputs.upload }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Diff against previous main
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # First-parent diff = everything the merge/push brought in.
          if git diff --name-only HEAD^ HEAD | grep -qE '^(android/|\.github/workflows/android-playstore\.yml)'; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Android changes in this merge; skipping upload."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

  upload:
    name: Build & upload AAB to Play internal
    needs: changes
    if: needs.changes.outputs.upload == 'true'
    # Secrets live in the protected "release" environment:
    #   PLAY_SERVICE_ACCOUNT_JSON  — Play Developer API service account JSON
    #   ANDROID_KEYSTORE_BASE64    — base64 of the upload keystore (.jks)
    #   ANDROID_KEYSTORE_PASSWORD  — keystore password
    #   ANDROID_KEY_ALIAS          — upload key alias
    #   ANDROID_KEY_PASSWORD       — upload key password
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set on the release environment"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release bundle
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # versionCode offset by 100 so it always ascends past any earlier pipeline.
          ./gradlew :app:bundleRelease --no-daemon \
            -PversionName="$ANDROID_VERSION_NAME" \
            -PversionCode=$((100 + RUN_NUMBER)) \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/upload.jks" \
            -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload to Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: social.betty
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
