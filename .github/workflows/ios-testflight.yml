name: TestFlight (iOS)

# Gated on CI: uploads only run after the CI workflow succeeds on main
# (workflow_run loses push paths-filtering, so the cheap guard job below
# re-checks that iOS code actually changed).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never upload two builds in parallel — TestFlight build numbers must ascend.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.5"
  # Must match the in-flight version in App Store Connect
  # (https://appstoreconnect.apple.com/apps/1636185602). Bump per release.
  MARKETING_VERSION: "1.0.5"

jobs:
  changes:
    name: Check for iOS changes
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      upload: ${{ steps.diff.outputs.upload }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Diff against previous main
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # First-parent diff = everything the merge/push brought in.
          if git diff --name-only HEAD^ HEAD | grep -qE '^(ios/|\.github/workflows/ios-testflight\.yml)'; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "No iOS changes in this merge; skipping upload."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

  upload:
    name: Archive & upload to TestFlight
    needs: changes
    if: needs.changes.outputs.upload == 'true'
    # Secrets live in the protected "release" environment:
    #   APP_STORE_CONNECT_API_KEY_ID    — ASC API key id (cloud signing
    #                                     requires the Admin role)
    #   APP_STORE_CONNECT_API_ISSUER_ID — ASC issuer id
    #   APP_STORE_CONNECT_API_KEY_P8    — contents of the .p8 private key
    # Environment variable (vars):
    #   APPLE_TEAM_ID                   — Apple Developer team id
    environment: release
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default; pin the
          # commit CI actually tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Code signing lives in ios/signing.yml (the root spec wins over
      # includes in XcodeGen, so signing keys must not appear in project.yml).
      # The committed signing.yml keeps builds unsigned; CI overwrites it.
      - name: Enable signing (overlay)
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::APPLE_TEAM_ID variable is not set on the release environment"
            exit 1
          fi
          cat > signing.yml <<EOF
          settings:
            base:
              CODE_SIGN_STYLE: Automatic
              DEVELOPMENT_TEAM: $APPLE_TEAM_ID
              CODE_SIGNING_REQUIRED: "YES"
              CODE_SIGNING_ALLOWED: "YES"
          EOF

      - name: Decode GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 secret missing"
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Betty/GoogleService-Info.plist
          test "$(wc -c < ios/Betty/GoogleService-Info.plist)" -gt 200

      - name: Generate project
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc_key.p8"

      # Cloud signing: Xcode fetches/creates cloud-managed certificates via
      # the ASC API at build time — no .p12 or provisioning profiles in CI.
      # Build numbers offset by 100: TestFlight already has builds up to 28
      # from the previous pipeline, and they must keep ascending.
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Betty.xcodeproj \
            -scheme Betty \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Betty.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION=$((100 + RUN_NUMBER)) \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # destination:upload makes -exportArchive deliver straight to
      # App Store Connect / TestFlight processing.
      - name: Export & upload
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Betty.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8"