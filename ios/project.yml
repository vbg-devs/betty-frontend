name: Betty
# Signing settings live in signing.yml only (the root spec wins over includes,
# so a CI-written overlay would be ignored if project.yml set the same keys).
include:
  - signing.yml
options:
  bundleIdPrefix: social.betty
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Swift 6 language mode (the toolchain is Swift 6.3 / "Swift 6.2+" feature set;
    # -swift-version only accepts 4/4.2/5/6).
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Betty:
    type: application
    platform: iOS
    sources:
      - path: Betty
    # Push Notifications (APNs registration for POST /user/me/add_push_token) and
    # universal links (applinks:betty.social — the server must publish
    # /.well-known/apple-app-site-association; see README.md). The entitlements file
    # is generated by xcodegen from these properties.
    entitlements:
      path: Betty/Betty.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.associated-domains:
          - applinks:betty.social
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: social.betty.app
        PRODUCT_NAME: Betty
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "1"
        # "1,2" (iPhone + iPad) is mandatory: the previous App Store version
        # supported iPad and Apple rejects updates that drop device support
        # (ITMS-90101). iPad runs the iPhone layouts full-screen in portrait.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Betty/Info.plist
      properties:
        CFBundleDisplayName: Betty
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Portrait-only on iPad requires opting out of multitasking.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        CFBundleURLTypes:
          - CFBundleURLName: social.betty.app
            CFBundleURLSchemes:
              - betty
        # Placeholder — create an iOS OAuth client in the Google Cloud console for
        # project betty-f676d and paste its client ID here. See ios/README.md.
        GoogleOAuthClientID: "812539187075-1ijbvedesug3dl8mtbvfnoh0rrvcblpe.apps.googleusercontent.com"
        ITSAppUsesNonExemptEncryption: false
        # UI tests run against a loopback (127.0.0.1) mock backend over plain http/ws —
        # local networking only, never a blanket arbitrary-loads exception.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  BettyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BettyTests
    dependencies:
      - target: Betty
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: social.betty.app.tests
  BettyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BettyUITests
    dependencies:
      - target: Betty
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: social.betty.app.uitests
        TEST_TARGET_NAME: Betty
        # The UI-test runner hosts the mock backend on Network.framework queues; classic
        # nonisolated-by-default is the pragmatic harness mode (XCTest drives the app in
        # a separate process — there is no shared mutable UI state in this target).
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Betty:
    build:
      targets:
        Betty: all
        BettyTests: [test]
        BettyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BettyTests
        - BettyUITests
